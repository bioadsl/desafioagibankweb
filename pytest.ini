[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --html=reports/report.html --self-contained-html --capture=tee-sys
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning

markers =
    dias_uteis: Testes da Calculadora de Dias Úteis
    juros_compostos: Testes da Calculadora de Juros Compostos
    blog_agi: Testes do Blog do Agi (pesquisa de artigos)
    cenario_feliz: Cenários positivos (fluxo principal com dados válidos)
    cenario_erro: Cenários negativos / validação de campos obrigatórios
    validacao: Testes de validação de página / carregamento
    investimento: Testes da aba Investimento da calculadora de juros
    divida: Testes da aba Dívida da calculadora de juros
    pesquisa: Testes de pesquisa de artigos
    cenario_1: Cenário relevante 1 - pesquisa com termo existente
    cenario_2: Cenário relevante 2 - pesquisa com termo inexistente
    cenario_3: Cenário 3 - data-driven com termos frequentes
    katalon_golden: Teste de regressao GOLDEN capturado via Katalon Recorder (asserts exatos extraidos do Selenium)
