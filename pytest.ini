[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --html=reports/report.html --self-contained-html --capture=tee-sys
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning

markers =
    dias_uteis: Calculadora dias uteis
    juros_compostos: Calculadora juros compostos
    calculadora_investimentos: POM CalculadoraInvestimentos (suite investimento)
    blog_agi: Pesquisa blog Agi
    cenario_feliz: Cenarios dados validos
    cenario_erro: Cenarios negativos / campos obrigatorios
    validacao: Validacao pagina / carregamento
    investimento: Aba Investimento
    divida: Aba Divida
    pesquisa: Pesquisa artigos
    smoke: Smoke test (basico)
    carregamento: Carregamento pagina / iframe
    integracao: Integracao (fluxo completo)
    conformidade: Padroes arquitetura / POM interface publica
    portfolio: Carteira de investimentos validada
    long_run: Duracao longa (>60 meses)
    blazemeter: Regressao capturada BlazeMeter WD
    katalon_golden: Regressao GOLDEN Katalon Recorder
    auditoria: Sistema auditoria (criptografado 2 camadas)
    seguranca: Criptografia Fernet AES-128 / chain hash
    performance: Auditoria perf <1ms por registro
    lgpd: Retencao LGPD (purge 90 dias)
    integridade: Cadeia custodia SHA-256
    cenario_1: Pesquisa termo existente
    cenario_2: Pesquisa termo inexistente
    cenario_3: Data-driven termos frequentes

