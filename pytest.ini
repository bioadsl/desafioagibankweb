[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --html=reports/report.html --self-contained-html --capture=tee-sys
filterwarnings =
    ignore::pytest.PytestUnknownMarkWarning

markers =
    dias_uteis: Testes da Calculadora de Dias Úteis
    juros_compostos: Testes da Calculadora de Juros Compostos
    calculadora_investimentos: Testes DA NOVA POM CalculadoraInvestimentosPage (suite de investimento dedicada)
    blog_agi: Testes do Blog do Agi (pesquisa de artigos)
    cenario_feliz: Cenários positivos (fluxo principal com dados válidos)
    cenario_erro: Cenários negativos / validação de campos obrigatórios
    validacao: Testes de validação de página / carregamento
    investimento: Testes da aba Investimento da calculadora de juros
    divida: Testes da aba Dívida da calculadora de juros
    pesquisa: Testes de pesquisa de artigos
    smoke: Testes rápidos de Smoke (carregamento básico / elementos presentes)
    carregamento: Testes de carregamento de página / iframe / elementos
    integracao: Testes de integração (navegação por menus, fluxo completo)
    conformidade: Testes de conformidade com padrões de arquitetura / interface pública dos POMs
    portfolio: Testes de carteira padrão / cenários de investimento validados
    long_run: Testes de longa duração (cenários > 60 meses)
    blazemeter: Teste de regressão dos 2 passos de navegação por menu capturados no BlazeMeter WD
    katalon_golden: Teste de regressao GOLDEN capturado via Katalon Recorder (asserts exatos extraidos do Selenium)
    auditoria: Testes do NOVO Sistema de Auditoria de Relatorios (logs criptografados, 2 camadas)
    seguranca: Testes de seguranca (criptografia Fernet AES-128, cadeia de custodia hash)
    performance: Testes de performance (desempenho <1ms por registro de auditoria)
    lgpd: Testes de politica de retencao LGPD (purge seco e real 90 dias)
    integridade: Testes de integridade da cadeia de custodia SHA-256
    cenario_1: Cenário relevante 1 - pesquisa com termo existente
    cenario_2: Cenário relevante 2 - pesquisa com termo inexistente
    cenario_3: Cenário 3 - data-driven com termos frequentes
